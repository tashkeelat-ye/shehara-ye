name: Shehara Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Shehara Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Node and Java
        run: |
          echo "Node:"
          node --version
          echo "npm:"
          npm --version
          echo "Java:"
          java --version

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Build web application
        run: npm run build

      - name: Verify web output
        run: |
          if [ ! -f ".output/public/index.html" ]; then
            echo "ERROR: .output/public/index.html was not generated."
            echo "Contents of .output:"
            find .output -maxdepth 3 -type f 2>/dev/null || true
            exit 1
          fi

          echo "Web build output verified successfully."

      - name: Install Capacitor Android
        run: |
          npx cap add android

      - name: Verify Android project
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: Capacitor Android project was not created."
            exit 1
          fi

          echo "Android project verified."

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK was not generated."
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shehara-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
